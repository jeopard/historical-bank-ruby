language: ruby
rvm:
  - 3.1
  - 3.2
  - 3.3
  - 3.4
  - truffleruby
install:
  - bundle install --jobs=3 --retry=3
services:
  - redis-server
cache:
  - bundler
env:
  - REDIS_PORT=6379 BUNDLE_GEMFILE=gemfiles/money_6.gemfile
  - REDIS_PORT=6379 BUNDLE_GEMFILE=gemfiles/money_7.gemfile
script:
  - bundle exec rspec
notifications:
  email:
    on_success: change
    on_failure: change
