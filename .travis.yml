language: ruby
rvm:
  - 3.1.6
  - 3.2.4
  - 3.3.5
  - truffleruby
install:
  - bundle install --jobs=3 --retry=3
  - bundle exec appraisal install
services:
  - redis-server
cache:
  - bundler
env:
  - REDIS_PORT=6379
gemfile:
  - gemfiles/money_6.gemfile
  - gemfiles/money_7.gemfile
script:
  - bundle exec rspec
notifications:
  email:
    on_success: change
    on_failure: change
